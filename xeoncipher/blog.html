<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECODE BLOG — XEONCIPHER</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <meta name="description" content="Community gematria decode blog. Browse sections, post decodes, and discuss cipher research at XEONCIPHER." />
  <meta name="robots" content="index, follow" />

  <style>
@font-face { font-family: "MatrixFont"; src: url("matrix code nfi.ttf") format("truetype"); }
@font-face { font-family: "AER";  src: url("Alien-Encounters-Regular.ttf") format("truetype"); }
@font-face { font-family: "AEB";  src: url("AEB.ttf")  format("truetype"); }
@font-face { font-family: "AESR"; src: url("AESR.ttf") format("truetype"); }
@font-face { font-family: "AESB"; src: url("AESB.ttf") format("truetype"); }
@font-face { font-family: "GOS";  src: url("GOS.ttf")  format("truetype"); }
@font-face { font-family: "77";   src: url("77.ttf")   format("truetype"); }
@font-face { font-family: "G7";   src: url("G7.ttf")   format("truetype"); }

:root {
  --g-btn-neon-1:   #003d07;
  --g-btn-neon-2:   #084200;
  --g-btn-inner-bg: #060b0f;
  --g-btn-text:     #c8f0da;
  --c-min:    #4a7a5a;
  --c-mid:    #62bf80;
  --c-bright: #8ed4a8;
  --c-text:   #d4ede0;
  --font-body:    "AER",  "Consolas", "Courier New", monospace;
  --font-buttons: "AEB",  "Consolas", "Courier New", monospace;
  --font-display: "GOS",  "Consolas", "Courier New", monospace;
  --font-meta:    "77",   "Consolas", "Courier New", monospace;
  --font-sub:     "AESR", "Consolas", "Courier New", monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  border-radius: 0 !important;
  -webkit-tap-highlight-color: transparent;
  margin: 0; padding: 0;
}

html, body {
  width: 100%; min-height: 100%;
  background: #000000;
  font-family: var(--font-body);
  color: var(--c-mid);
  overflow-x: hidden;
  text-transform: uppercase;
}

canvas#matrix,
body > canvas {
  position: fixed !important;
  inset: 0 !important;
  z-index: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  pointer-events: none;
}

body::after {
  content: ''; position: fixed; inset: 0; z-index: 2;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,76,0.008) 3px,rgba(0,255,76,0.008) 6px);
  pointer-events: none;
}

.page {
  position: relative; z-index: 1;
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 32px 80px 32px;
}

/* ── NAV ── */
.blog-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 28px 0;
  border-bottom: 1px solid #0d2014;
  margin-bottom: 52px;
  gap: 16px;
  flex-wrap: wrap;
}

.nav-logo-link {
  font-family: var(--font-display);
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: #00ff4c;
  text-decoration: none;
  text-shadow: 0 0 14px rgba(0,255,76,0.3);
  letter-spacing: -1px;
}

.nav-tm {
  font-family: var(--font-display);
  font-size: 0.45em;
  color: rgba(0,255,76,0.55);
  vertical-align: super;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: nowrap;
}

.nav-link {
  font-family: var(--font-meta);
  font-size: 0.68rem;
  letter-spacing: 3px;
  color: var(--c-min);
  text-decoration: none;
  padding: 8px 14px;
  border: 1px solid #0d2014;
  clip-path: polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.nav-link:hover { color: var(--c-mid); border-color: #1e4a2c; background: #040c07; }

.nav-user-area {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-username {
  font-family: var(--font-meta);
  font-size: 0.65rem;
  letter-spacing: 2px;
  color: #00ff4c;
  padding: 8px 14px;
  border: 1px solid #1e4a2c;
  clip-path: polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
  background: #020d05;
}

.nav-logout {
  font-family: var(--font-meta);
  font-size: 0.6rem;
  letter-spacing: 2px;
  color: #4a5a4a;
  background: none;
  border: 1px solid #1a2a1a;
  clip-path: polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
  cursor: pointer;
  padding: 8px 12px;
  transition: color 0.2s, border-color 0.2s;
}
.nav-logout:hover { color: #ff4444; border-color: #5a1a1a; }

/* NAV LOGIN BUTTON */
.nav-btn {
  font-family: var(--font-meta);
  font-size: 0.65rem;
  letter-spacing: 3px;
  color: var(--g-btn-text);
  background: transparent;
  border: 1px solid #1e4a2c;
  cursor: pointer;
  padding: 0;
  position: relative;
  overflow: hidden;
  height: 36px;
  min-width: 100px;
  clip-path: polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  transition: border-color 0.2s, background 0.2s;
}
.nav-btn-inner {
  display: block;
  position: absolute; inset: 1.5px;
  background: var(--g-btn-inner-bg);
  clip-path: polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  z-index: 0;
}
.nav-btn-txt { position: relative; z-index: 2; pointer-events: none; white-space: nowrap; }
.nav-btn:hover { border-color: #2d5a3d; background: #040c07; }
.nav-btn:hover .nav-btn-txt { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

@keyframes neonRot { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

/* ── BLOG HERO ── */
.blog-hero {
  text-align: center;
  margin-bottom: 60px;
}

.blog-hero::before {
  content: '';
  display: block;
  width: 1px; height: 40px;
  background: linear-gradient(to bottom, transparent, #2d5a3d);
  margin: 0 auto 32px auto;
}
.blog-hero.no-drip::before { display: none; }
.blog-hero.no-drip { margin-bottom: 24px; }

.blog-hero-title {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 6vw, 3.2rem);
  color: #00ff4c;
  letter-spacing: -1px;
  text-shadow: 0 0 20px rgba(0,255,76,0.2);
  margin-bottom: 16px;
}

.blog-hero-sub {
  font-family: var(--font-sub);
  font-size: clamp(0.62rem, 2vw, 0.82rem);
  letter-spacing: clamp(1px, 1vw, 5px);
  color: var(--c-min);
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.8;
}

/* ── SECTION HEADER ── */
.section-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
}
.section-header-line {
  flex: 1; height: 1px;
  background: linear-gradient(to right, #1e4a2c, transparent);
}
.section-header-line.right { background: linear-gradient(to left, #1e4a2c, transparent); }
.section-title {
  font-family: var(--font-display);
  font-size: 0.9rem; letter-spacing: 7px;
  color: var(--c-mid);
  white-space: nowrap;
}

/* ── VIEW HEADER ── */
.view-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 0;
}

.view-header .section-header {
  width: 100%;
  margin-bottom: 0;
}

/* ── NEW BUTTON ── */
.new-btn {
  font-family: var(--font-meta);
  font-size: 0.65rem;
  letter-spacing: 3px;
  color: var(--c-mid);
  background: #04000a;
  border: 1px solid #1e4a2c;
  clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  cursor: pointer;
  padding: 12px 20px;
  white-space: nowrap;
  margin-bottom: 28px;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  flex-shrink: 0;
}
.new-btn:hover { color: var(--c-bright); border-color: #2d5a3d; background: #060010; }
.new-btn:active { background: #080018; }

/* ── SECTIONS GRID ── */
.sections-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  margin-top: 4px;
}

/* ── SECTION CARD ── */
.section-card {
  background: #04000a;
  clip-path: polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);
  position: relative;
  cursor: pointer;
  overflow: hidden;
  transition: background 0.2s;
  display: flex;
  flex-direction: column;
}

.section-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, #2d5a3d, transparent);
  pointer-events: none;
}
.section-card::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,255,76,0.02) 0%, transparent 60%);
  pointer-events: none;
}

.section-card:hover { background: #060010; }
.section-card:hover .sc-enter { color: var(--c-bright); border-color: #2d5a3d; }

.sc-body {
  padding: 28px 28px 0 28px;
  flex: 1;
}

.sc-title {
  font-family: var(--font-buttons);
  font-size: 1rem;
  letter-spacing: 3px;
  color: var(--c-bright);
  margin-bottom: 10px;
  line-height: 1.3;
}

.sc-desc {
  font-family: var(--font-sub);
  font-size: 0.7rem;
  letter-spacing: 1px;
  color: var(--c-min);
  line-height: 1.8;
  margin-bottom: 20px;
}

.sc-footer {
  padding: 16px 28px 24px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  border-top: 1px solid #0d2014;
}

.sc-meta {
  font-family: var(--font-meta);
  font-size: 0.6rem;
  letter-spacing: 2px;
  color: var(--c-min);
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  align-items: center;
  width: 100%;
}
.sc-meta > span:nth-child(1) { text-align: right; }
.sc-meta > span:nth-child(3) { text-align: center; }
.sc-meta > span:nth-child(5) { text-align: left; }
.sc-meta-dot { opacity: 0.4; padding: 0 10px; }

.sc-enter {
  font-family: var(--font-meta);
  font-size: 0.6rem;
  letter-spacing: 2px;
  color: var(--c-min);
  border: 1px solid #1a3a24;
  clip-path: polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
  padding: 6px 12px;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}

.sc-post-count {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: #00ff4c;
  text-shadow: 0 0 10px rgba(0,255,76,0.25);
  letter-spacing: 1px;
  margin-right: 4px;
}

/* ── BREADCRUMB ── */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 32px;
  font-family: var(--font-meta);
  font-size: 0.62rem;
  letter-spacing: 2px;
  flex-wrap: wrap;
  background: #04000a;
  border: 1px solid #1e4a2c;
  padding: 12px 18px;
  clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  position: relative;
  z-index: 10;
}

.bc-link {
  color: var(--c-mid);
  cursor: pointer;
  transition: color 0.2s;
}
.bc-link:hover { color: #00ff4c; }

.bc-sep { color: #1e4a2c; }

.bc-current { color: var(--c-mid); }

/* ── PROFILE OVERLAY ── */
.profile-overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.82);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.profile-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  background: #04000a;
  border: 1px solid #1e4a2c;
  clip-path: polygon(16px 0%,100% 0%,calc(100% - 16px) 100%,0% 100%);
  padding: 40px 52px;
  position: relative;
}
.profile-box::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, #00ff4c, transparent);
}
.profile-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  letter-spacing: 4px;
  color: #00ff4c;
  text-shadow: 0 0 14px rgba(0,255,76,0.3);
}
.profile-logout-btn {
  font-family: var(--font-meta);
  font-size: 0.62rem;
  letter-spacing: 3px;
  color: #cc3333;
  background: #0d0202;
  border: 1px solid #5a1a1a;
  clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
  cursor: pointer;
  padding: 10px 24px;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.profile-logout-btn:hover { color: #ff4444; border-color: #882222; background: #150303; }
.profile-close {
  position: absolute; top: 14px; right: 18px;
  font-family: var(--font-meta);
  font-size: 0.8rem;
  color: var(--c-min);
  background: none;
  border: 1px solid #1e4a2c;
  clip-path: polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
  width: 28px; height: 28px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s, border-color 0.2s;
}
.profile-close:hover { color: #ff4444; border-color: #5a1a1a; }

/* ── CONFIRM OVERLAY ── */
.confirm-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.confirm-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  background: #04000a;
  border: 1px solid #5a1a1a;
  clip-path: polygon(14px 0%,100% 0%,calc(100% - 14px) 100%,0% 100%);
  padding: 36px 48px;
  position: relative;
}
.confirm-box::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, #ff4444, transparent);
}
.confirm-title {
  font-family: var(--font-display);
  font-size: 0.9rem;
  letter-spacing: 5px;
  color: #ff4444;
}
.confirm-sub {
  font-family: var(--font-sub);
  font-size: 0.7rem;
  letter-spacing: 1px;
  color: var(--c-min);
}
.confirm-btns {
  display: flex;
  gap: 12px;
}
.confirm-yes {
  font-family: var(--font-meta);
  font-size: 0.62rem;
  letter-spacing: 3px;
  color: #ff4444;
  background: #0d0202;
  border: 1px solid #5a1a1a;
  clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
  cursor: pointer;
  padding: 10px 24px;
  transition: color 0.2s, border-color 0.2s;
}
.confirm-yes:hover { color: #ff6666; border-color: #882222; }
.confirm-no {
  font-family: var(--font-meta);
  font-size: 0.62rem;
  letter-spacing: 3px;
  color: var(--c-min);
  background: none;
  border: 1px solid #1e4a2c;
  clip-path: polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
  cursor: pointer;
  padding: 10px 24px;
  transition: color 0.2s, border-color 0.2s;
}
.confirm-no:hover { color: var(--c-mid); border-color: #2d5a3d; }

/* ── SECTION DETAIL HEADER ── */
.section-detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 32px;
  padding: 28px;
  background: #04000a;
  clip-path: polygon(16px 0%,100% 0%,calc(100% - 16px) 100%,0% 100%);
  position: relative;
  overflow: hidden;
}
.section-detail-header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, #2d5a3d, transparent);
}
.section-detail-header::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,255,76,0.03) 0%, transparent 60%);
  pointer-events: none;
}

.sd-title {
  font-family: var(--font-display);
  font-size: clamp(1.1rem, 3vw, 1.6rem);
  color: #00ff4c;
  letter-spacing: -1px;
  text-shadow: 0 0 14px rgba(0,255,76,0.2);
  margin-bottom: 10px;
  position: relative; z-index: 1;
}

.sd-desc {
  font-family: var(--font-sub);
  font-size: 0.72rem;
  letter-spacing: 1px;
  color: var(--c-min);
  line-height: 1.8;
  margin-bottom: 10px;
  position: relative; z-index: 1;
}

.sd-meta {
  font-family: var(--font-meta);
  font-size: 0.6rem;
  letter-spacing: 2px;
  color: #2d5a3d;
  position: relative; z-index: 1;
}

/* ── POSTS LIST ── */
.posts-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.empty-state {
  background: #04000a;
  clip-path: polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);
  padding: 52px 28px;
  text-align: center;
  position: relative;
}
.empty-state::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, #1e4a2c, transparent);
}
.empty-title {
  font-family: var(--font-display);
  font-size: 0.9rem;
  letter-spacing: 5px;
  color: var(--c-min);
  margin-bottom: 12px;
}
.empty-sub {
  font-family: var(--font-sub);
  font-size: 0.65rem;
  letter-spacing: 1px;
  color: #2d4a38;
  line-height: 1.8;
}

/* ── POST CARD ── */
.post-card {
  background: #0d0d0d;
  clip-path: polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);
  position: relative;
  cursor: pointer;
  overflow: hidden;
  transition: background 0.2s;
}

.post-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, #1e4a2c, transparent);
}

.post-card:hover { background: #141414; }

.pc-inner {
  padding: 24px 28px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

.pc-num {
  font-family: var(--font-display);
  font-size: 0.65rem;
  letter-spacing: 2px;
  color: #1e4a2c;
  flex-shrink: 0;
  padding-top: 3px;
  min-width: 24px;
}

.pc-content { flex: 1; min-width: 0; }

.pc-title {
  font-family: var(--font-buttons);
  font-size: 0.9rem;
  letter-spacing: 3px;
  color: var(--c-bright);
  margin-bottom: 8px;
  line-height: 1.4;
  transition: color 0.2s;
}
.post-card:hover .pc-title { color: #00ff4c; }

.pc-preview {
  font-family: var(--font-sub);
  font-size: 0.68rem;
  letter-spacing: 0.5px;
  color: var(--c-min);
  line-height: 1.8;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.pc-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.pc-author {
  font-family: var(--font-meta);
  font-size: 0.58rem;
  letter-spacing: 2px;
  color: #00ff4c;
  background: #020d05;
  border: 1px solid #1a3a24;
  clip-path: polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
  padding: 3px 8px;
}

.pc-date {
  font-family: var(--font-meta);
  font-size: 0.58rem;
  letter-spacing: 1.5px;
  color: var(--c-min);
}

.pc-comments {
  font-family: var(--font-meta);
  font-size: 0.58rem;
  letter-spacing: 1.5px;
  color: var(--c-min);
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* ── POST VIEW ── */
.post-view-card {
  background: #000000;
  clip-path: polygon(16px 0%,100% 0%,calc(100% - 16px) 100%,0% 100%);
  position: relative;
  overflow: hidden;
  margin-bottom: 2px;
}
.post-view-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, #2d5a3d, transparent);
}
.post-view-card::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,255,76,0.025) 0%, transparent 60%);
  pointer-events: none;
}

.pv-header {
  padding: 36px 36px 24px 36px;
  border-bottom: 1px solid #0d2014;

<script>
/* ═══════════════════════════════════════════════════════

const SB_URL = 'https://fzqtizgevfyaeppwbhfp.supabase.co';
const SB_KEY = 'sb_publishable_2q8K3-xGRKTBSkMvpuMFbw_K6pjWosS';

async function sbFetch(path, options = {}){
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || '',
      ...(options.headers || {})
    }
  });
  if(res.status === 204 || res.status === 201) return null;
  const data = await res.json();
  if(!res.ok) throw new Error(data.message || data.error || 'Request failed');
  return data;
}

const SB = {
  async getUsers()           { return await sbFetch('users?select=*') || []; },
  async getUserByUsername(u) { return (await sbFetch('users?username=eq.' + encodeURIComponent(u) + '&select=*') || [])[0]; },
  async insertUser(row)      { return await sbFetch('users', { method:'POST', prefer:'return=representation', body: JSON.stringify(row) }); },

  async getSections()        { return await sbFetch('sections?select=*&order=created_at.asc') || []; },
  async getSectionById(id)   { return (await sbFetch('sections?id=eq.' + id + '&select=*') || [])[0]; },
  async insertSection(row)   { return await sbFetch('sections', { method:'POST', prefer:'return=representation', body: JSON.stringify(row) }); },

  async getPosts()            { return await sbFetch('posts?select=*&order=created_at.desc') || []; },
  async getPostsBySection(id) { return await sbFetch('posts?section_id=eq.' + id + '&select=*&order=created_at.desc') || []; },
  async getPostById(id)       { return (await sbFetch('posts?id=eq.' + id + '&select=*') || [])[0]; },
  async insertPost(row)       { return await sbFetch('posts', { method:'POST', prefer:'return=representation', body: JSON.stringify(row) }); },

  async getCommentsByPost(id) { return await sbFetch('comments?post_id=eq.' + id + '&select=*&order=created_at.asc') || []; },
  async getCommentCountsBySection(sectionId){
    const posts = await this.getPostsBySection(sectionId);
    return posts;
  },
  async insertComment(row)    { return await sbFetch('comments', { method:'POST', prefer:'return=representation', body: JSON.stringify(row) }); },

  async updatePost(id, fields){ return await sbFetch('posts?id=eq.' + id, { method:'PATCH', prefer:'return=representation', body: JSON.stringify(fields) }); },
  async deletePost(id)        { return await sbFetch('posts?id=eq.' + id, { method:'DELETE' }); },
  async deleteCommentsByPost(id){ return await sbFetch('comments?post_id=eq.' + id, { method:'DELETE' }); },
  async deleteSection(id)     { return await sbFetch('sections?id=eq.' + id, { method:'DELETE' }); },
  async deletePostsBySection(id){ return await sbFetch('posts?section_id=eq.' + id, { method:'DELETE' }); },
};

/* ═══════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════ */
let currentUser   = null;
let authTab       = 'login';
let pendingAction = null;

async function hashPw(pw){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode('xeoncipher:' + pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function loadSession(){
  try{
    const s = JSON.parse(localStorage.getItem('xc_session'));
    if(s){ currentUser = s; renderNav(); }
  }catch(e){}
}

function saveSession(user){ localStorage.setItem('xc_session', JSON.stringify(user)); }
function clearSession()   { localStorage.removeItem('xc_session'); }

function renderNav(){
  const area = document.getElementById('nav-auth-area');
  if(currentUser){
    area.innerHTML = `
      <div class="nav-user-area">
        <span class="nav-username" style="cursor:pointer;" onclick="openProfileOverlay()">&#x25C8; ${esc(currentUser.username)}</span>
      </div>`;
  } else {
    area.innerHTML = `
      <button class="nav-btn" onclick="openAuth()">
        <span class="nav-btn-inner"></span>
        <span class="nav-btn-txt">&#x25C8; LOGIN</span>
      </button>`;
  }
}

function openProfileOverlay(){
  const el = document.createElement('div');
  el.className = 'profile-overlay';
  el.id = 'profile-overlay';
  el.innerHTML = `
    <div class="profile-box">
      <button class="profile-close" onclick="closeProfileOverlay()">&#x2715;</button>
      <div class="profile-name">&#x25C8; ${esc(currentUser.username)}</div>
      <button class="profile-logout-btn" onclick="confirmLogout()">&#x25C8; LOGOUT</button>
    </div>`;
  el.addEventListener('click', e => { if(e.target === el) closeProfileOverlay(); });
  document.body.appendChild(el);
}

function closeProfileOverlay(){
  const el = document.getElementById('profile-overlay');
  if(el) el.remove();
}

function confirmLogout(){
  closeProfileOverlay();
  const el = document.createElement('div');
  el.className = 'confirm-overlay';
  el.id = 'confirm-overlay';
  el.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-title">&#x25C8; ARE YOU SURE?</div>
      <div class="confirm-sub">YOU WILL BE LOGGED OUT OF YOUR ACCOUNT.</div>
      <div class="confirm-btns">
        <button class="confirm-yes" onclick="doLogout()">&#x25C8; LOGOUT</button>
        <button class="confirm-no" onclick="closeConfirmOverlay()">&#x25C8; CANCEL</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}

function closeConfirmOverlay(){
  const el = document.getElementById('confirm-overlay');
  if(el) el.remove();
}

function doLogout(){
  closeConfirmOverlay();
  currentUser = null;
  clearSession();
  renderNav();
  showToast('LOGGED OUT');
}

function logout(){ confirmLogout(); }

function openAuth(action){
  if(action) pendingAction = action;
  switchAuthTab('login');
  document.getElementById('auth-username').value = '';
  document.getElementById('auth-password').value = '';
  document.getElementById('auth-confirm').value = '';
  hideAuthError();
  openModal('modal-auth');
  setTimeout(()=>{ document.getElementById('auth-username').focus(); }, 120);
}

function switchAuthTab(tab){
  authTab = tab;
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  document.getElementById('auth-submit-txt').textContent = tab==='login' ? 'LOGIN' : 'REGISTER';
  document.getElementById('auth-modal-title').textContent = tab==='login' ? '◈ LOGIN' : '◈ REGISTER';
  const confirmGroup = document.getElementById('auth-confirm-group');
  confirmGroup.style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('auth-confirm').value = '';
  // Reset password visibility on tab switch
  const pwInput = document.getElementById('auth-password');
  const cfInput = document.getElementById('auth-confirm');
  [pwInput, cfInput].forEach(inp => { inp.type = 'password'; });
  document.querySelectorAll('.pw-toggle').forEach(btn => { btn.textContent = '👁'; });
  hideAuthError();
}

function togglePw(inputId, btn){
  const inp = document.getElementById(inputId);
  const showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  btn.style.opacity = showing ? '1' : '0.45';
}

function showAuthError(msg){ const el=document.getElementById('auth-error'); el.textContent=msg; el.style.display='block'; }
function hideAuthError()   { document.getElementById('auth-error').style.display='none'; }

async function handleAuth(){
  const username = document.getElementById('auth-username').value.trim().toUpperCase().replace(/[^A-Z0-9_]/g,'');
  const password = document.getElementById('auth-password').value;

  if(!username){ showAuthError('USERNAME CANNOT BE EMPTY'); return; }
  if(username.length < 3){ showAuthError('USERNAME MUST BE AT LEAST 3 CHARACTERS'); return; }
  if(!password){ showAuthError('PASSWORD CANNOT BE EMPTY'); return; }
  if(password.length < 6){ showAuthError('PASSWORD MUST BE AT LEAST 6 CHARACTERS'); return; }

  if(authTab === 'register'){
    const confirm = document.getElementById('auth-confirm').value;
    if(!confirm){ showAuthError('PLEASE CONFIRM YOUR PASSWORD'); return; }
    if(password !== confirm){ showAuthError('PASSWORDS DO NOT MATCH'); return; }
  }

  const submitBtn = document.getElementById('auth-submit-txt');
  submitBtn.textContent = 'LOADING...';

  try{
    const hash = await hashPw(password);

    if(authTab === 'login'){
      const user = await SB.getUserByUsername(username);
      if(!user){ showAuthError('USERNAME NOT FOUND'); return; }
      if(user.password_hash !== hash){ showAuthError('INCORRECT PASSWORD'); return; }
      currentUser = { id: user.id, username: user.username };
      saveSession(currentUser);
      renderNav();
      closeModal('modal-auth');
      showToast('WELCOME BACK, ' + username);
      if(pendingAction) executePendingAction();

    } else {
      const existing = await SB.getUserByUsername(username);
      if(existing){ showAuthError('USERNAME ALREADY TAKEN'); return; }
      const newUser = { id: crypto.randomUUID(), username, password_hash: hash, created_at: new Date().toISOString() };
      await SB.insertUser(newUser);
      currentUser = { id: newUser.id, username: newUser.username };
      saveSession(currentUser);
      renderNav();
      closeModal('modal-auth');
      showToast('ACCOUNT CREATED — WELCOME, ' + username);
      if(pendingAction) executePendingAction();
    }
  } catch(e){
    showAuthError('ERROR: ' + (e.message || 'PLEASE TRY AGAIN'));
  } finally {
    submitBtn.textContent = authTab === 'login' ? 'LOGIN' : 'REGISTER';
  }
}

function requireAuth(action){
  if(currentUser){
    if(action === 'new-section') openNewSection();
    else if(action === 'new-post') openNewPost();
  } else {
    openAuth(action);
  }
}

function executePendingAction(){
  const a = pendingAction; pendingAction = null;
  setTimeout(()=>{
    if(a === 'new-section') openNewSection();
    else if(a === 'new-post') openNewPost();
  }, 200);
}

/* ═══════════════════════════════════════════════════════
   VIEWS
═══════════════════════════════════════════════════════ */
let currentSectionId = null;
let currentPostId    = null;

function updateHero(view, sectionTitle){
  const hero    = document.getElementById('blog-hero');
  const titleEl = document.getElementById('hero-title');
  const subEl   = document.getElementById('hero-sub');
  if(view === 'sections'){
    titleEl.innerHTML = '&#x25C8; DECODE BLOG';
    subEl.style.display = '';
    hero.classList.remove('no-drip');
  } else {
    titleEl.textContent = '◈ ' + (sectionTitle || '');
    subEl.style.display = 'none';
    hero.classList.add('no-drip');
  }
}

function showView(name){
  ['sections','section','post'].forEach(v => {
    document.getElementById('view-' + v).style.display = (v === name) ? 'block' : 'none';
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showSections(push){
  if(push !== false) history.pushState({ view:'sections' }, '');
  currentSectionId = null; currentPostId = null;
  updateHero('sections');
  renderSections();
  showView('sections');
}

function showSection(sectionId, push){
  if(push !== false) history.pushState({ view:'section', sectionId }, '');
  currentSectionId = sectionId;
  renderSection(sectionId);
  showView('section');
}

function backToSection(){
  if(currentSectionId) showSection(currentSectionId);
  else showSections();
}

function showPost(postId, push){
  if(push !== false) history.pushState({ view:'post', postId, sectionId: currentSectionId }, '');
  currentPostId = postId;
  renderPost(postId);
  showView('post');
}

window.addEventListener('popstate', function(e){
  const s = e.state;
  if(!s || s.view === 'sections'){
    currentSectionId = null; currentPostId = null;
    updateHero('sections');
    renderSections();
    showView('sections');
  } else if(s.view === 'section'){
    currentSectionId = s.sectionId;
    renderSection(s.sectionId);
    showView('section');
  } else if(s.view === 'post'){
    currentSectionId = s.sectionId;
    currentPostId    = s.postId;
    renderPost(s.postId);
    showView('post');
  }
});

/* ═══════════════════════════════════════════════════════
   RENDER: SECTIONS
═══════════════════════════════════════════════════════ */
let _cachedSections = [];
let _cachedPosts    = [];

async function renderSections(){
  const grid = document.getElementById('sections-grid');
  grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-title">&#x25C8; LOADING...</div></div>`;
  const searchEl = document.getElementById('sections-search');
  if(searchEl) searchEl.value = '';
  updateSearchUI('');

  try{
    const [sections, posts] = await Promise.all([ SB.getSections(), SB.getPosts() ]);
    _cachedSections = sections;
    _cachedPosts    = posts;

    if(!sections.length){
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <div class="empty-title">NO SECTIONS YET</div>
          <div class="empty-sub">BE THE FIRST TO CREATE A DECODE SECTION.<br>LOGIN OR REGISTER AND CLICK + NEW SECTION.</div>
        </div>`;
      return;
    }
    paintSections(sections);
  } catch(e){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-title">&#x25C8; FAILED TO LOAD</div><div class="empty-sub">${esc(e.message)}</div></div>`;
  }
}

function paintSections(sections){
  const grid = document.getElementById('sections-grid');
  if(!sections.length){
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-title">&#x25C8; NO RESULTS</div>
        <div class="empty-sub">NO SECTIONS MATCH YOUR SEARCH.</div>
      </div>`;
    return;
  }
  grid.innerHTML = sections.map(s => {
    const count   = _cachedPosts.filter(p => p.section_id === s.id).length;
    const isOwner = currentUser && currentUser.username === s.created_by;
    return `
    <div class="section-card" onclick="showSection('${s.id}')">
      <div class="sc-body">
        <div class="sc-title">&#x25C8; ${esc(s.title)}</div>
        <div class="sc-desc">${esc(s.description)}</div>
      </div>
      <div class="sc-footer">
        <div class="sc-meta">
          <span><span class="sc-post-count">${count}</span> DECODES</span>
          <span class="sc-meta-dot">&#x25AA;</span>
          <span>BY ${esc(s.created_by)}</span>
          <span class="sc-meta-dot">&#x25AA;</span>
          <span>${fmtDate(s.created_at)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;width:100%;justify-content:center;">
          <div class="sc-enter">ENTER &#x25B8;</div>
          ${isOwner ? `<button class="dots-btn" onclick="event.stopPropagation();openActionOverlay('section','${s.id}')">&#x22EE;</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterSections(query){
  updateSearchUI(query);
  const q = query.trim().toUpperCase();
  if(!q){
    paintSections(_cachedSections);
    document.getElementById('search-count').textContent = '';
    return;
  }
  const filtered = _cachedSections.filter(s =>
    s.title.toUpperCase().includes(q) ||
    (s.description || '').toUpperCase().includes(q) ||
    (s.created_by  || '').toUpperCase().includes(q)
  );
  paintSections(filtered);
  const total = _cachedSections.length;
  document.getElementById('search-count').textContent =
    filtered.length + ' OF ' + total + ' SECTION' + (total !== 1 ? 'S' : '');
}

function updateSearchUI(query){
  const icon  = document.getElementById('search-icon');
  const clear = document.getElementById('search-clear');
  if(!icon || !clear) return;
  if(query && query.trim()){
    icon.style.display = 'none';
    clear.classList.add('visible');
  } else {
    icon.style.display = '';
    clear.classList.remove('visible');
    const sc = document.getElementById('search-count');
    if(sc) sc.textContent = '';
  }
}

function clearSearch(){
  const el = document.getElementById('sections-search');
  if(el){ el.value = ''; el.focus(); }
  filterSections('');
}

/* ═══════════════════════════════════════════════════════
   RENDER: SECTION DETAIL
═══════════════════════════════════════════════════════ */
async function renderSection(sectionId){
  const list = document.getElementById('posts-list');
  list.innerHTML = `<div class="empty-state"><div class="empty-title">&#x25C8; LOADING...</div></div>`;

  try{
    const section = await SB.getSectionById(sectionId);
    if(!section){ showSections(); return; }

    const sectionPosts = await SB.getPostsBySection(sectionId);

    updateHero('section', section.title);
    const sdDesc = document.getElementById('sd-desc');
    sdDesc.textContent      = section.description;
    sdDesc.dataset.sectionId = section.id;
    document.getElementById('sd-meta').textContent = 'CREATED BY ' + section.created_by + ' — ' + fmtDate(section.created_at);
    document.getElementById('section-posts-title').textContent = '◈ ' + sectionPosts.length + ' DECODE' + (sectionPosts.length !== 1 ? 'S' : '');

    const dotsBtn = document.getElementById('sd-dots-btn');
    if(dotsBtn) dotsBtn.style.display = (currentUser && currentUser.username === section.created_by) ? '' : 'none';

    if(!sectionPosts.length){
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-title">&#x25C8; NO DECODES YET</div>
          <div class="empty-sub">THIS SECTION IS EMPTY.<br>LOG IN AND CLICK + NEW DECODE TO SUBMIT THE FIRST ONE.</div>
        </div>`;
      return;
    }

    const allPostIds   = sectionPosts.map(p => p.id);
    const allComments  = await sbFetch('comments?post_id=in.(' + allPostIds.join(',') + ')&select=post_id') || [];

    list.innerHTML = sectionPosts.map((p, i) => {
      const cmtCount = allComments.filter(c => c.post_id === p.id).length;
      const preview  = p.content.replace(/\n/g,' ').substring(0, 130) + (p.content.length > 130 ? '...' : '');
      const isOwner  = currentUser && currentUser.username === p.author;
      return `
      <div class="post-card" onclick="showPost('${p.id}')">
        <div class="pc-inner">
          <div class="pc-num">${String(i+1).padStart(2,'0')}</div>
          <div class="pc-content">
            <div class="pc-title">${esc(p.title)}</div>
            <div class="pc-preview">${esc(preview)}</div>
            <div class="pc-meta">
              <span class="pc-author">${esc(p.author)}</span>
              <span class="pc-date">${fmtDate(p.created_at)}</span>
              <span class="pc-comments">&#x25A1; ${cmtCount} ${cmtCount===1?'COMMENT':'COMMENTS'}</span>
              ${isOwner ? `<button class="dots-btn" style="margin-left:auto;" onclick="event.stopPropagation();openActionOverlay('post','${p.id}')">&#x22EE;</button>` : ''}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch(e){
    list.innerHTML = `<div class="empty-state"><div class="empty-title">&#x25C8; FAILED TO LOAD</div><div class="empty-sub">${esc(e.message)}</div></div>`;
  }
}

/* ═══════════════════════════════════════════════════════
   RENDER: POST
═══════════════════════════════════════════════════════ */
async function renderPost(postId){
  const area = document.getElementById('post-content-area');
  area.innerHTML = `<div class="empty-state"><div class="empty-title">&#x25C8; LOADING...</div></div>`;

  try{
    const post    = await SB.getPostById(postId);
    if(!post){ showSections(); return; }

    const section = await SB.getSectionById(post.section_id);
    updateHero('section', section ? section.title : '');

    let cipherHtml = '';
    if(post.cipher_data && post.cipher_data.trim()){
      const rows = post.cipher_data.trim().split('\n').map(line => {
        const [phrase, val] = line.split('=');
        if(!phrase || !val) return '';
        return `<div class="cipher-row">
          <span class="cipher-phrase">${esc(phrase.trim())}</span>
          <div class="cipher-separator"></div>
          <span class="cipher-value">${esc(val.trim())}</span>
        </div>`;
      }).filter(Boolean).join('');
      if(rows){
        cipherHtml = `
          <div class="cipher-block">
            <div class="cipher-block-title">&#x25C8; KEY CIPHER VALUES</div>
            <div class="cipher-rows">${rows}</div>
          </div>`;
      }
    }

    const isOwner = currentUser && currentUser.username === post.author;
    const ownerHtml = isOwner ? `
      <div class="pv-owner-row">
        <button class="dots-btn" onclick="openActionOverlay('post','${post.id}')">&#x22EE;</button>
        <span style="font-family:var(--font-meta);font-size:0.55rem;letter-spacing:2px;color:#2d5a3d;">YOUR DECODE</span>
      </div>` : '';

    area.innerHTML = `
      <div class="post-view-card">
        <div class="pv-header">
          <div class="pv-title">${esc(post.title)}</div>
          <div class="pv-meta-row">
            <span class="pv-author-badge">&#x25C8; ${esc(post.author)}</span>
            <span class="pv-date">${fmtDateLong(post.created_at)}</span>
          </div>
          ${ownerHtml}
        </div>
        <div class="pv-body">
          <div class="pv-content">${esc(post.content)}</div>
          ${cipherHtml}
        </div>
      </div>`;

    await renderComments(postId);
  } catch(e){
    area.innerHTML = `<div class="empty-state"><div class="empty-title">&#x25C8; FAILED TO LOAD</div><div class="empty-sub">${esc(e.message)}</div></div>`;
  }
}

/* ═══════════════════════════════════════════════════════
   RENDER: COMMENTS
═══════════════════════════════════════════════════════ */
async function renderComments(postId){
  const list = document.getElementById('comments-list');
  list.innerHTML = '';

  try{
    const comments = await SB.getCommentsByPost(postId);

    document.getElementById('comments-count-title').textContent =
      '◈ ' + comments.length + ' ' + (comments.length === 1 ? 'COMMENT' : 'COMMENTS');

    if(!comments.length){
      list.innerHTML = `
        <div class="empty-state" style="margin-bottom:2px;">
          <div class="empty-title">&#x25C8; NO COMMENTS YET</div>
          <div class="empty-sub">BE THE FIRST TO ADD YOUR DECODE TO THIS POST.</div>
        </div>`;
    } else {
      list.innerHTML = comments.map(c => `
        <div class="comment-card">
          <div class="comment-header">
            <span class="comment-author">&#x25C8; ${esc(c.author)}</span>
            <span class="comment-date">${fmtDateLong(c.created_at)}</span>
          </div>
          <div class="comment-text">${esc(c.content)}</div>
        </div>`).join('');
    }
  } catch(e){
    list.innerHTML = `<div class="empty-state"><div class="empty-title">&#x25C8; COULD NOT LOAD COMMENTS</div></div>`;
  }

  const formArea = document.getElementById('comment-form-area');
  if(currentUser){
    formArea.innerHTML = `
      <div class="comment-form">
        <div class="comment-submit-row">
          <div class="form-group">
            <label class="form-label">LOGGED IN AS ${esc(currentUser.username)}</label>
            <textarea id="new-comment-text" class="form-textarea" placeholder="ADD YOUR FINDS" maxlength="1000" rows="3"></textarea>
          </div>
          <button class="submit-btn" onclick="submitComment('${postId}')">
            <span class="submit-inner"></span>
            <span class="submit-txt">POST</span>
          </button>
        </div>
      </div>`;
  } else {
    formArea.innerHTML = `
      <div class="comment-login-prompt">
        <div class="clp-text">&#x25C8; LOGIN OR REGISTER TO ADD YOUR DECODE TO THIS POST</div>
        <button class="clp-btn" onclick="openAuth('comment')">&#x25C8; LOGIN / REGISTER</button>
      </div>`;
  }
}

/* ═══════════════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════════════ */
function openNewSection(){
  document.getElementById('ns-title').value = '';
  document.getElementById('ns-desc').value  = '';
  document.getElementById('ns-error').style.display = 'none';
  openModal('modal-new-section');
  setTimeout(()=>{ document.getElementById('ns-title').focus(); }, 120);
}

async function createSection(){
  const title  = document.getElementById('ns-title').value.trim().toUpperCase();
  const desc   = document.getElementById('ns-desc').value.trim().toUpperCase();
  const errEl  = document.getElementById('ns-error');
  const btnTxt = document.querySelector('#modal-new-section .submit-txt');
  errEl.style.display = 'none';

  if(!title){ errEl.textContent='TITLE CANNOT BE EMPTY'; errEl.style.display='block'; return; }
  if(title.length < 3){ errEl.textContent='TITLE TOO SHORT'; errEl.style.display='block'; return; }

  btnTxt.textContent = 'CREATING...';
  try{
    const existing = await sbFetch('sections?title=eq.' + encodeURIComponent(title) + '&select=id');
    if(existing && existing.length){ errEl.textContent='A SECTION WITH THIS TITLE ALREADY EXISTS'; errEl.style.display='block'; return; }

    const newSection = {
      id: 'sec-' + Date.now(),
      title,
      description: desc || 'COMMUNITY DECODE SECTION',
      created_by: currentUser.username,
      created_at: new Date().toISOString()
    };
    await SB.insertSection(newSection);
    closeModal('modal-new-section');
    showToast('SECTION CREATED — ' + title);
    showSection(newSection.id);
  } catch(e){
    errEl.textContent = 'ERROR: ' + (e.message || 'PLEASE TRY AGAIN');
    errEl.style.display = 'block';
  } finally {
    btnTxt.textContent = 'CREATE SECTION';
  }
}

function openNewPost(){
  document.getElementById('np-title').value   = '';
  document.getElementById('np-content').value = '';
  document.getElementById('np-ciphers').value = '';
  document.getElementById('np-error').style.display = 'none';
  document.getElementById('np-char-count').textContent = '0 / 4000';
  openModal('modal-new-post');
  setTimeout(()=>{ document.getElementById('np-title').focus(); }, 120);
}

function updateCharCount(){
  const len = document.getElementById('np-content').value.length;
  document.getElementById('np-char-count').textContent = len + ' / 4000';
}

async function createPost(){
  if(!currentSectionId){ closeModal('modal-new-post'); return; }
  const title   = document.getElementById('np-title').value.trim().toUpperCase();
  const content = document.getElementById('np-content').value.trim().toUpperCase();
  const ciphers = document.getElementById('np-ciphers').value.trim().toUpperCase();
  const errEl   = document.getElementById('np-error');
  const btnTxt  = document.querySelector('#modal-new-post .submit-txt');
  errEl.style.display = 'none';

  if(!content || content.length < 20){ errEl.textContent='CONTENT TOO SHORT — MIN 20 CHARACTERS'; errEl.style.display='block'; return; }

  const finalTitle = title || content.substring(0, 60).replace(/\n/g,' ') + (content.length > 60 ? '...' : '');

  btnTxt.textContent = 'SUBMITTING...';
  try{
    const post = {
      id: 'post-' + Date.now(),
      section_id: currentSectionId,
      title: finalTitle, content,
      cipher_data: ciphers,
      author: currentUser.username,
      created_at: new Date().toISOString()
    };
    await SB.insertPost(post);
    closeModal('modal-new-post');
    showToast('DECODE SUBMITTED — ' + finalTitle.substring(0,30));
    renderSection(currentSectionId);
  } catch(e){
    errEl.textContent = 'ERROR: ' + (e.message || 'PLEASE TRY AGAIN');
    errEl.style.display = 'block';
  } finally {
    btnTxt.textContent = 'SUBMIT DECODE';
  }
}

async function submitComment(postId){
  const text   = document.getElementById('new-comment-text').value.trim().toUpperCase();
  const btnTxt = document.querySelector('#comment-form-area .submit-txt');
  if(!text){ showToast('COMMENT CANNOT BE EMPTY', true); return; }
  if(text.length < 5){ showToast('COMMENT TOO SHORT', true); return; }

  if(btnTxt) btnTxt.textContent = 'POSTING...';
  try{
    const comment = {
      id: 'cmt-' + Date.now(),
      post_id: postId,
      content: text,
      author: currentUser.username,
      created_at: new Date().toISOString()
    };
    await SB.insertComment(comment);
    await renderComments(postId);
    showToast('COMMENT POSTED');
  } catch(e){
    showToast('ERROR POSTING COMMENT', true);
  }
}

/* ═══════════════════════════════════════════════════════
   ACTION OVERLAY (3-dot menu)
═══════════════════════════════════════════════════════ */
function openActionOverlay(type, id){
  closeActionOverlay();

  // Resolve label from cached data — no fragile inline string escaping
  let label = '';
  if(type === 'post'){
    const p = _cachedPosts && _cachedPosts.find(p => p.id === id);
    if(p){ label = p.title.substring(0, 40); }
    else {
      // May be viewing an individual post not yet in cache — use hero title
      const t = document.getElementById('hero-title');
      label = t ? t.textContent.replace(/^◈\s*/,'').substring(0,40) : '';
    }
  } else {
    const s = _cachedSections && _cachedSections.find(s => s.id === id);
    if(s){ label = s.title; }
    else {
      const t = document.getElementById('hero-title');
      label = t ? t.textContent.replace(/^◈\s*/,'') : '';
    }
  }

  const el = document.createElement('div');
  el.className = 'action-overlay';
  el.id = 'action-overlay';
  el.addEventListener('click', e => { if(e.target === el) closeActionOverlay(); });

  if(type === 'post'){
    el.innerHTML = `
      <div class="action-box">
        <div class="action-box-label">&#x25C8; ${esc(label)}</div>
        <button class="action-box-btn edit" id="ao-edit">
          <span class="action-box-icon">&#x270E;</span> EDIT DECODE
        </button>
        <button class="action-box-btn del" id="ao-del">
          <span class="action-box-icon">&#x2715;</span> DELETE DECODE
        </button>
      </div>`;
    el.querySelector('#ao-edit').addEventListener('click', () => { closeActionOverlay(); openEditPost(id); });
    el.querySelector('#ao-del').addEventListener('click',  () => { closeActionOverlay(); confirmDeletePost(id, label); });
  } else {
    el.innerHTML = `
      <div class="action-box">
        <div class="action-box-label">&#x25C8; ${esc(label)}</div>
        <button class="action-box-btn del" id="ao-del">
          <span class="action-box-icon">&#x2715;</span> DELETE SECTION
        </button>
      </div>`;
    el.querySelector('#ao-del').addEventListener('click', () => { closeActionOverlay(); confirmDeleteSection(id, label); });
  }
  document.body.appendChild(el);
}

function closeActionOverlay(){
  const el = document.getElementById('action-overlay');
  if(el) el.remove();
}

/* ═══════════════════════════════════════════════════════
   EDIT POST
═══════════════════════════════════════════════════════ */
async function openEditPost(postId){
  const post = await SB.getPostById(postId);
  if(!post) return;
  document.getElementById('ep-id').value      = post.id;
  document.getElementById('ep-title').value   = post.title || '';
  document.getElementById('ep-content').value = post.content || '';
  document.getElementById('ep-ciphers').value = post.cipher_data || '';
  document.getElementById('ep-char-count').textContent = (post.content||'').length + ' / 4000';
  document.getElementById('ep-error').style.display = 'none';
  openModal('modal-edit-post');
  setTimeout(() => { document.getElementById('ep-title').focus(); }, 120);
}

function updateEditCharCount(){
  const len = document.getElementById('ep-content').value.length;
  document.getElementById('ep-char-count').textContent = len + ' / 4000';
}

async function saveEditPost(){
  const id      = document.getElementById('ep-id').value;
  const title   = document.getElementById('ep-title').value.trim().toUpperCase();
  const content = document.getElementById('ep-content').value.trim().toUpperCase();
  const ciphers = document.getElementById('ep-ciphers').value.trim().toUpperCase();
  const errEl   = document.getElementById('ep-error');
  const btnTxt  = document.querySelector('#modal-edit-post .submit-txt');
  errEl.style.display = 'none';

  if(!content || content.length < 20){
    errEl.textContent = 'CONTENT TOO SHORT — MIN 20 CHARACTERS';
    errEl.style.display = 'block'; return;
  }
  const finalTitle = title || content.substring(0,60).replace(/\n/g,' ') + (content.length > 60 ? '...' : '');
  btnTxt.textContent = 'SAVING...';
  try{
    await SB.updatePost(id, { title: finalTitle, content, cipher_data: ciphers });
    closeModal('modal-edit-post');
    showToast('DECODE UPDATED');
    if(currentPostId === id) renderPost(id);
    else if(currentSectionId) renderSection(currentSectionId);
  } catch(e){
    errEl.textContent = 'ERROR: ' + (e.message || 'PLEASE TRY AGAIN');
    errEl.style.display = 'block';
  } finally {
    btnTxt.textContent = 'SAVE CHANGES';
  }
}

/* ═══════════════════════════════════════════════════════
   DELETE POST
═══════════════════════════════════════════════════════ */
function confirmDeletePost(postId, label){
  const el = document.createElement('div');
  el.className = 'confirm-overlay';
  el.id = 'confirm-overlay';
  el.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-title">&#x25C8; DELETE DECODE?</div>
      <div class="confirm-sub">${esc(label)} — THIS CANNOT BE UNDONE.</div>
      <div class="confirm-btns">
        <button class="confirm-yes" id="cdp-yes">&#x25C8; DELETE</button>
        <button class="confirm-no"  onclick="closeConfirmOverlay()">&#x25C8; CANCEL</button>
      </div>
    </div>`;
  el.querySelector('#cdp-yes').addEventListener('click', () => doDeletePost(postId));
  document.body.appendChild(el);
}

async function doDeletePost(postId){
  closeConfirmOverlay();
  try{
    await SB.deleteCommentsByPost(postId);
    await SB.deletePost(postId);
    showToast('DECODE DELETED');
    if(currentSectionId) showSection(currentSectionId);
    else showSections();
  } catch(e){
    showToast('ERROR DELETING DECODE', true);
  }
}

/* ═══════════════════════════════════════════════════════
   DELETE SECTION
═══════════════════════════════════════════════════════ */
function confirmDeleteSection(sectionId, label){
  const el = document.createElement('div');
  el.className = 'confirm-overlay';
  el.id = 'confirm-overlay';
  el.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-title">&#x25C8; DELETE SECTION?</div>
      <div class="confirm-sub">${esc(label)} — ALL DECODES INSIDE WILL ALSO BE DELETED.</div>
      <div class="confirm-btns">
        <button class="confirm-yes" id="cds-yes">&#x25C8; DELETE</button>
        <button class="confirm-no"  onclick="closeConfirmOverlay()">&#x25C8; CANCEL</button>
      </div>
    </div>`;
  el.querySelector('#cds-yes').addEventListener('click', () => doDeleteSection(sectionId));
  document.body.appendChild(el);
}

async function doDeleteSection(sectionId){
  closeConfirmOverlay();
  try{
    const posts = await SB.getPostsBySection(sectionId);
    for(const p of posts) await SB.deleteCommentsByPost(p.id);
    await SB.deletePostsBySection(sectionId);
    await SB.deleteSection(sectionId);
    showToast('SECTION DELETED');
    showSections();
  } catch(e){
    showToast('ERROR DELETING SECTION', true);
  }
}

/* ═══════════════════════════════════════════════════════
   MODALS
═══════════════════════════════════════════════════════ */
function openModal(id){ document.getElementById(id).style.display='flex'; document.body.style.overflow='hidden'; }
function closeModal(id){ document.getElementById(id).style.display='none'; document.body.style.overflow=''; }
function handleOverlayClick(e, id){ if(e.target.id===id){ closeModal(id); } }

/* ═══════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════ */
let toastTimer = null;
function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  void t.offsetWidth;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2800);
}

/* ═══════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════ */
function esc(str){
  if(!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function fmtDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
  }catch(e){ return ''; }
}

function fmtDateLong(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).toUpperCase();
  }catch(e){ return ''; }
}
